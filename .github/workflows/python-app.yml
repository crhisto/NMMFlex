name: Python package

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            NMMFlexPy/requirements.txt
            NMMFlexPy/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r NMMFlexPy/requirements-dev.txt
      - name: Lint with ruff
        run: |
          # Stop the build on Python syntax errors or undefined names.
          ruff check --output-format=github --select=E9,F63,F7,F82 .
          # Default ruff rules as warnings with GitHub annotations.
          ruff check --output-format=github --exit-zero .
      - name: Test with pytest and coverage
        run: |
          PYTHONPATH=NMMFlexPy/src pytest \
            --cov=NMMFlexPy/src \
            --cov-report=term \
            NMMFlexPy/tests/
